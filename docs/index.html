<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Veterinaria · Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f3d3e;--paper:#f4f8f7;--white:#fff;--leaf:#2f9e8c;--leaf-d:#1f7568;--sun:#f2b84b;--line:#d5e2df;--muted:#4a6867;--warn:#c4552d;
--display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;--body:"Public Sans","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;font-size:1rem;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer}
aside{background:var(--ink);color:#dcebe8;padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:#fff;padding:0 8px}
.brand svg{width:32px;height:32px;flex:none}
nav{display:flex;flex-direction:column;gap:4px}
nav a{color:#dcebe8;text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current=page]{background:var(--sun);color:var(--ink);font-weight:600}
.nota{margin-top:auto;font-size:.85rem;color:#a9c5c0;padding:0 8px}
main{padding:32px 40px 56px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
.chip{background:var(--white);border:1.5px dashed var(--leaf);color:var(--leaf-d);padding:6px 14px;border-radius:999px;font-size:.88rem;font-weight:600}
.resumen{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.dato{background:var(--white);border:1.5px solid var(--ink);border-radius:14px;padding:14px 20px;min-width:150px}
.dato b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1}
.dato span{color:var(--muted);font-size:.92rem}
.panel{background:var(--white);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.92rem;background:#eef5f3}
tr:last-child td{border-bottom:0}
tbody tr.fila{cursor:pointer}
tbody tr.fila:hover{background:#f2f9f7}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.84rem;font-weight:600;background:#e2f1ee;color:var(--leaf-d)}
.tag.alerta{background:#fbe6dc;color:var(--warn)}
.tag.aviso{background:#fcefd0;color:#7a5200}
.tag.gris{background:#e8eeed;color:var(--muted)}
input[type=search]{width:100%;max-width:360px;padding:11px 16px;border:1.5px solid var(--ink);border-radius:999px;font:inherit;margin-bottom:18px;background:var(--white)}
.volver{background:none;border:0;color:var(--leaf-d);font-weight:600;padding:0;margin-bottom:14px}
.ficha{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:20px}
.ficha dt{color:var(--muted)} .ficha dd{font-weight:600}
.hist{list-style:none;padding:8px 24px 20px;position:relative}
.hist::before{content:"";position:absolute;left:31px;top:20px;bottom:20px;width:2px;background:var(--leaf)}
.hist li{position:relative;padding:14px 0 14px 34px;border-bottom:1px dashed var(--line)}
.hist li:last-child{border-bottom:0}
.hist li::before{content:"";position:absolute;left:0;top:19px;width:16px;height:16px;border-radius:50%;background:var(--white);border:4px solid var(--leaf)}
.hist b{font-family:var(--display)}
.hist small{display:block;color:var(--muted)}
h2{font-family:var(--display);font-size:1.15rem;padding:18px 24px 0}
@media (max-width:860px){
 body{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px}
 nav{flex-direction:row;flex-wrap:wrap}.nota{display:none}
 main{padding:24px 16px 48px}.ficha{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#f2b84b"/><g fill="#0f3d3e"><ellipse cx="13" cy="15" rx="3" ry="4"/><ellipse cx="27" cy="15" rx="3" ry="4"/><ellipse cx="8.5" cy="23" rx="2.6" ry="3.4"/><ellipse cx="31.5" cy="23" rx="2.6" ry="3.4"/><path d="M20 20c-5 0-9 4-9 8 0 3 2.5 4.5 5 4.5 1.6 0 2.8-.7 4-.7s2.4.7 4 .7c2.5 0 5-1.5 5-4.5 0-4-4-8-9-8z"/></g></svg>
    Clínica Veterinaria
  </div>
  <nav id="menu" aria-label="Secciones del sistema">
    <a href="#agenda">Agenda</a>
    <a href="#mascotas">Mascotas</a>
    <a href="#duenos">Dueños</a>
    <a href="#veterinarios">Veterinarios</a>
    <a href="#tratamientos">Tratamientos</a>
  </nav>
  <p class="nota">Vista de demostración, sin conexión a la base de datos.</p>
</aside>
<main id="vista" tabindex="-1"></main>

<script>
/* ============ DATOS ============
   Vacíos por ahora. Cada colección usará los nombres de columna del esquema:
   duenos:       codigo_dueno, nombre, apellidos, correo, telefono, direccion
   mascotas:     codigo_mascota, nombre, especie, raza, edad, sexo, notas, codigo_dueno (puede ser null),
                 color_pelaje (gatos), peso_ideal (perros)
   veterinarios: codigo_veterinario, nombre, apellidos, especialidades (lista)
   citas:        codigo_mascota, codigo_cita, fecha, hora, notas, diagnostico, codigo_veterinario
   tratamientos: codigo_tratamiento, descripcion, fecha_tratamiento, fecha_vencimiento, codigo_mascota, codigo_cita */
const HOY = new Date().toLocaleDateString("sv-SE");
const DATOS = {duenos: [], mascotas: [], veterinarios: [], citas: [], tratamientos: []};

/* ============ CAPA DE ACCESO A DATOS ============
   Hoy lee DATOS. Con backend, cada función pasa a ser, por ejemplo:
   citas: () => fetch("/api/citas").then(r => r.json())                    */
const api = {
  duenos:       async () => DATOS.duenos,
  mascotas:     async () => DATOS.mascotas,
  veterinarios: async () => DATOS.veterinarios,
  citas:        async () => DATOS.citas,
  tratamientos: async () => DATOS.tratamientos
};

/* ============ UTILIDADES ============ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fecha = f => new Date(f + "T12:00").toLocaleDateString("es-MX", {day:"numeric", month:"short", year:"numeric"});
const dias = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const nombreDe = (lista, k, id) => { const x = lista.find(e => e[k] === id); return x ? x.nombre + " " + (x.apellidos || "") : ""; };
const $vista = document.getElementById("vista");
const tabla = (cols, filas, clase) => `<div class="panel scroll"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${filas}</tbody></table></div>`;
const encabezado = (t, s) => `<div class="top"><div><h1>${t}</h1><p class="sub">${s}</p></div></div>`;

/* ============ VISTAS ============ */
async function agenda() 
{
  const [citas, masc, vets] = await Promise.all([api.citas(), api.mascotas(), api.veterinarios()]);
  const hoy = citas.filter(c => c.fecha === HOY).sort((a, b) => a.hora.localeCompare(b.hora));
  const filas = hoy.map(c => `<tr class="fila" data-m="${c.codigo_mascota}"><td><b>${esc(c.hora)}</b></td><td>${esc(nombreDe(masc,"codigo_mascota",c.codigo_mascota))}</td><td>${esc(c.notas)}</td><td>${esc(nombreDe(vets,"codigo_veterinario",c.codigo_veterinario))}</td><td><span class="tag ${c.diagnostico ? "" : "aviso"}">${c.diagnostico ? "Atendida" : "Pendiente"}</span></td></tr>`).join("");
  $vista.innerHTML = encabezado("Agenda del día", fecha(HOY)) +
    `<div class="resumen"><div class="dato"><b>${hoy.length}</b><span>citas hoy</span></div><div class="dato"><b>${hoy.filter(c=>!c.diagnostico).length}</b><span>por atender</span></div></div>` +
    tabla(["Hora","Mascota","Motivo","Veterinario","Estado"], filas);
  $vista.querySelectorAll(".fila").forEach(f => f.onclick = () => location.hash = "#mascota/" + f.dataset.m);
}

async function mascotas() 
{
  const [masc, duenos] = await Promise.all([api.mascotas(), api.duenos()]);
  const pintar = q => {
    const lista = masc.filter(m => (m.nombre + m.especie + m.raza).toLowerCase().includes(q.toLowerCase()));
    document.getElementById("cuerpo").innerHTML = tabla(["Nombre","Especie","Raza","Edad","Dueño"], lista.map(m =>
      `<tr class="fila" data-m="${m.codigo_mascota}"><td><b>${esc(m.nombre)}</b></td><td>${esc(m.especie)}</td><td>${esc(m.raza)}</td><td>${m.edad} años</td><td>${m.codigo_dueno ? esc(nombreDe(duenos,"codigo_dueno",m.codigo_dueno)) : '<span class="tag gris">Sin dueño registrado</span>'}</td></tr>`).join(""));
    document.querySelectorAll(".fila").forEach(f => f.onclick = () => location.hash = "#mascota/" + f.dataset.m);
  };
  $vista.innerHTML = encabezado("Mascotas", "Busca por nombre, especie o raza.") + `<input type="search" id="q" placeholder="Buscar mascota" aria-label="Buscar mascota"><div id="cuerpo"></div>`;
  pintar("");
  document.getElementById("q").oninput = e => pintar(e.target.value);
}

async function ficha(id) 
{
  const [masc, duenos, citas, trat, vets] = await Promise.all([api.mascotas(), api.duenos(), api.citas(), api.tratamientos(), api.veterinarios()]);
  const m = masc.find(x => x.codigo_mascota === id);
  if (!m) return mascotas();
  const d = duenos.find(x => x.codigo_dueno === m.codigo_dueno);
  const hist = citas.filter(c => c.codigo_mascota === id).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const extra = m.color_pelaje ? ["Color de pelaje", m.color_pelaje] : m.peso_ideal ? ["Peso ideal", m.peso_ideal + " kg"] : null;
  const li = hist.map(c => {
    const ts = trat.filter(t => t.codigo_mascota === id && t.codigo_cita === c.codigo_cita);
    return `<li><b>${esc(c.notas)}</b><small>${fecha(c.fecha)}, ${esc(c.hora)} · ${esc(nombreDe(vets,"codigo_veterinario",c.codigo_veterinario))}</small>${c.diagnostico ? "Diagnóstico: " + esc(c.diagnostico) : '<span class="tag aviso">Pendiente</span>'}${ts.map(t => `<small>Tratamiento: ${esc(t.descripcion)}, vence ${fecha(t.fecha_vencimiento)}</small>`).join("")}</li>`;
  }).join("");
  $vista.innerHTML = `<button class="volver" onclick="history.back()">Volver</button>` + encabezado(m.nombre, `${m.especie}, ${m.raza}`) +
    `<div class="ficha"><div class="panel"><dl><dt>Edad</dt><dd>${m.edad} años</dd><dt>Sexo</dt><dd>${m.sexo === "H" ? "Hembra" : "Macho"}</dd>${extra ? `<dt>${extra[0]}</dt><dd>${esc(extra[1])}</dd>` : ""}<dt>Notas</dt><dd>${esc(m.notas) || "—"}</dd><dt>Dueño</dt><dd>${d ? esc(d.nombre + " " + d.apellidos) : "Sin dueño registrado"}</dd>${d ? `<dt>Teléfono</dt><dd>${esc(d.telefono)}</dd>` : ""}</dl></div>` +
    `<div class="panel"><h2>Historial clínico</h2><ul class="hist">${li || "<li>Sin citas registradas.</li>"}</ul></div></div>`;
}

async function duenos() 
{
  const [d, masc] = await Promise.all([api.duenos(), api.mascotas()]);
  $vista.innerHTML = encabezado("Dueños", "Los datos de contacto se guardan una sola vez.") +
    tabla(["Nombre","Teléfono","Correo","Dirección","Mascotas"], d.map(x => `<tr><td><b>${esc(x.nombre+" "+x.apellidos)}</b></td><td>${esc(x.telefono)}</td><td>${esc(x.correo)}</td><td>${esc(x.direccion)}</td><td>${esc(masc.filter(m=>m.codigo_dueno===x.codigo_dueno).map(m=>m.nombre).join(", "))}</td></tr>`).join(""));
}

async function veterinarios() {
  const [v, citas] = await Promise.all([api.veterinarios(), api.citas()]);
  $vista.innerHTML = encabezado("Veterinarios", "Un veterinario puede tener varias especialidades, o ninguna.") +
    tabla(["Nombre","Especialidades","Citas hoy"], v.map(x => `<tr><td><b>${esc(x.nombre+" "+x.apellidos)}</b></td><td>${x.especialidades.length ? x.especialidades.map(e=>`<span class="tag">${esc(e)}</span>`).join(" ") : '<span class="tag gris">General</span>'}</td><td>${citas.filter(c=>c.codigo_veterinario===x.codigo_veterinario && c.fecha===HOY).length}</td></tr>`).join(""));
}

async function tratamientos() {
  const [t, masc] = await Promise.all([api.tratamientos(), api.mascotas()]);
  const lista = [...t].sort((a, b) => a.fecha_vencimiento.localeCompare(b.fecha_vencimiento));
  $vista.innerHTML = encabezado("Tratamientos y vacunas", "Ordenados por fecha de vencimiento.") +
    tabla(["Tratamiento","Mascota","Aplicado","Vence","Estado"], lista.map(x => { const d = dias(HOY, x.fecha_vencimiento);
      return `<tr class="fila" data-m="${x.codigo_mascota}"><td><b>${esc(x.descripcion)}</b></td><td>${esc(nombreDe(masc,"codigo_mascota",x.codigo_mascota))}</td><td>${fecha(x.fecha_tratamiento)}</td><td>${fecha(x.fecha_vencimiento)}</td><td><span class="tag ${d <= 7 ? "alerta" : d <= 30 ? "aviso" : ""}">${d < 0 ? "Vencido" : "En " + d + " días"}</span></td></tr>`; }).join(""));
  $vista.querySelectorAll(".fila").forEach(f => f.onclick = () => location.hash = "#mascota/" + f.dataset.m);
}

/* ============ NAVEGACIÓN ============ */
const rutas = {agenda, mascotas, duenos, veterinarios, tratamientos};
async function ir() {
  const [r, id] = (location.hash.slice(1) || "agenda").split("/");
  const activa = r === "mascota" ? "mascotas" : r;
  document.querySelectorAll("#menu a").forEach(a => a.removeAttribute("aria-current"));
  const enlace = document.querySelector(`#menu a[href="#${activa}"]`);
  if (enlace) enlace.setAttribute("aria-current", "page");
  await (r === "mascota" ? ficha(Number(id)) : (rutas[r] || agenda)());
  window.scrollTo(0, 0);
}
addEventListener("hashchange", ir);
ir();
</script>
</body>
</html>
